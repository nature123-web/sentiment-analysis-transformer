seed: 42
out_dir: runs/base

data:
  dataset: synthetic      # synthetic | imdb
  root: data
  n_synthetic: 6000
  vocab_size: 4000
  min_frequency: 2
  max_length: 256
  val_fraction: 0.1

model:
  d_model: 256
  n_heads: 8
  n_layers: 4
  dim_feedforward: 512
  dropout: 0.1
  num_classes: 2
  pool: attention         # attention | mean | max | cls

train:
  epochs: 12
  batch_size: 32
  lr: 0.0003
  weight_decay: 0.01
  warmup_steps: 200
  grad_clip: 1.0
  label_smoothing: 0.05
  early_stopping_patience: 4
  num_workers: 0
  device: auto
